# Keeps "Sign in with Apple" working on the website. Apple's secret expires after 6 months,
# so this makes a fresh one on the 1st of every month and saves it to Supabase.
# Needs secrets: APPLE_TEAM_ID, APPLE_SIGNIN_KEY_ID, APPLE_SIGNIN_P8, APPLE_SERVICES_ID, SUPABASE_ACCESS_TOKEN
name: Apple sign-in secret

on:
  schedule:
    - cron: "17 14 1 * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Skip until Apple sign-in is set up
        id: check
        env:
          READY: ${{ secrets.APPLE_SIGNIN_P8 != '' && secrets.SUPABASE_ACCESS_TOKEN != '' }}
        run: echo "ready=$READY" >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.ready == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNIN_KEY_ID: ${{ secrets.APPLE_SIGNIN_KEY_ID }}
          APPLE_SIGNIN_P8: ${{ secrets.APPLE_SIGNIN_P8 }}
          APPLE_SERVICES_ID: ${{ secrets.APPLE_SERVICES_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/apple-auth-secret.mjs --apply
